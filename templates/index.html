<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Go HTMX Chat</title>
    <!-- HTMX и WS extension -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/ws.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        .chat-box { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 8px; }
        .auth-form { display: flex; flex-direction: column; gap: 10px; width: 300px; }
    </style>
</head>
<body>

{{if .IsAuthenticated}}
<h2>Привет, {{.Username}}! <a href="/logout">Выйти</a></h2>

<!-- Подключаем WebSocket через расширение HTMX -->
<div hx-ext="ws" ws-connect="/ws">
    <div id="chat-messages" class="chat-box">
        {{range .Messages}}
        <div class="message">
            <strong>{{.Username}}:</strong> {{.Content}}
        </div>
        {{end}}
    </div>

    <!-- Форма отправки сообщения по сокету -->
    <form ws-send id="form" hx-swap="none">
        <input type="text" name="content" placeholder="Введите сообщение..." required autocomplete="off">
        <button type="submit">Отправить</button>
    </form>
</div>

{{else}}
<h2>Вход / Регистрация</h2>
<form class="auth-form" action="/login" method="POST">
    <input type="text" name="username" placeholder="Логин" required>
    <input type="password" name="password" placeholder="Пароль" required>
    <button type="submit">Войти</button>
    <button type="submit" formaction="/register">Зарегистрироваться</button>
    <button hx-post="/chat/clear" hx-confirm="Удалить все сообщения?">
        Очистить чат
    </button>
</form>
{{end}}

</body>
</html>
